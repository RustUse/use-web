[workspace]
members = [
	"crates/use-web",
	"crates/use-http",
	"crates/use-method",
	"crates/use-header",
	"crates/use-status",
	"crates/use-cookie",
	"crates/use-mime",
	"crates/use-query",
	"crates/use-uri",
	"crates/use-url",
	"crates/use-origin",
	"crates/use-route",
	"crates/use-html",
	"crates/use-web-css",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustUse/use-web"
homepage = "https://rustuse.org"
documentation = "https://rustuse.org"
publish = false

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
	"use-http",
	"use-method",
	"use-header",
	"use-status",
	"use-cookie",
	"use-mime",
	"use-query",
	"use-uri",
	"use-url",
	"use-origin",
	"use-route",
	"use-html",
	"use-web-css",
	"use-web",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
