[package]
name = "use-web"
description = "Feature-gated facade crate for RustUse web primitives"
publish = true
authors.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["web", "http", "url", "html", "css"]
categories = ["web-programming", "parsing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
http = ["dep:use-http"]
method = ["dep:use-method"]
header = ["dep:use-header"]
status = ["dep:use-status"]
cookie = ["dep:use-cookie"]
mime = ["dep:use-mime"]
uri = ["dep:use-uri"]
url = ["dep:use-url"]
query = ["dep:use-query"]
origin = ["dep:use-origin"]
route = ["dep:use-route"]
html = ["dep:use-html"]
css = ["dep:use-css"]
full = [
    "http",
    "method",
    "header",
    "status",
    "cookie",
    "mime",
    "uri",
    "url",
    "query",
    "origin",
    "route",
    "html",
    "css",
]

[dependencies]
use-http = { version = "0.0.2", path = "../use-http", optional = true }
use-method = { version = "0.0.2", path = "../use-method", optional = true }
use-header = { version = "0.0.2", path = "../use-header", optional = true }
use-status = { version = "0.0.2", path = "../use-status", optional = true }
use-cookie = { version = "0.0.2", path = "../use-cookie", optional = true }
use-mime = { version = "0.0.2", path = "../use-mime", optional = true }
use-uri = { version = "0.0.2", path = "../use-uri", optional = true }
use-url = { version = "0.0.2", path = "../use-url", optional = true }
use-query = { version = "0.0.2", path = "../use-query", optional = true }
use-origin = { version = "0.0.2", path = "../use-origin", optional = true }
use-route = { version = "0.0.2", path = "../use-route", optional = true }
use-html = { version = "0.0.2", path = "../use-html", optional = true }
use-css = { version = "0.0.2", package = "use-web-css", path = "../use-web-css", optional = true }

[lints]
workspace = true
